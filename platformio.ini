; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL

[env:teensy41_scan]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D SCAN_CHANNELS
build_src_filter = +<*> -<main.cpp>

; ── Live hardware channel diagnostics ────────────────────────────────────────
; Upload:   pio run -e teensy41_ch1 -t upload
; Monitor:  pio device monitor
; Each env samples exactly one ADC channel and prints:
;   p2p | detected Hz | note name | cents off | error from target Hz

[env:teensy41_ch1]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D TEST_CHANNEL=1
build_src_filter = +<*> -<main.cpp>

[env:teensy41_ch2]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D TEST_CHANNEL=2
build_src_filter = +<*> -<main.cpp>

; ── Accuracy benchmarks (100 plucks -> avg cents, % within +/-5c / +/-10c) ─────
; Upload:  pio run -e teensy41_accuracy_lowe  -t upload   (Low E)
;          pio run -e teensy41_accuracy_a     -t upload   (A)
;          pio run -e teensy41_accuracy_d     -t upload   (D)
;          pio run -e teensy41_accuracy_g     -t upload   (G)
;          pio run -e teensy41_accuracy_b     -t upload   (B)
;          pio run -e teensy41_accuracy_hie   -t upload   (High E)
; Monitor: pio device monitor

[env:teensy41_accuracy_lowe]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=1
build_src_filter = +<*> -<main.cpp>

[env:teensy41_accuracy_a]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=2
build_src_filter = +<*> -<main.cpp>

[env:teensy41_accuracy_d]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=3
build_src_filter = +<*> -<main.cpp>

[env:teensy41_accuracy_g]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=4
build_src_filter = +<*> -<main.cpp>

[env:teensy41_accuracy_b]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=5
build_src_filter = +<*> -<main.cpp>

[env:teensy41_accuracy_hie]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D ACCURACY_TEST=6
build_src_filter = +<*> -<main.cpp>

