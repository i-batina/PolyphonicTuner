; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = teensy41

[env:teensy41]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL

[env:teensy41_scan]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D SCAN_CHANNELS
build_src_filter = +<*> -<main.cpp>

; ── Live hardware channel diagnostics ────────────────────────────────────────
; Upload:   pio run -e teensy41_ch1 -t upload
; Monitor:  pio device monitor
; Each env samples exactly one ADC channel and prints:
;   p2p | detected Hz | note name | cents off | error from target Hz

[env:teensy41_ch1]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D TEST_CHANNEL=1
build_src_filter = +<*> -<main.cpp>

[env:teensy41_ch2]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D TEST_CHANNEL=2
build_src_filter = +<*> -<main.cpp>

; ── Algorithmic unit tests (no guitar input needed) ───────────────────────────
; Uses synthetic sine waves to verify the YIN pitch detector and helpers.
; Run:  pio test -e teensy41_algo
; PlatformIO uploads to the Teensy, reads Unity results over serial,
; and prints a pass/fail summary in the terminal.

[env:teensy41_algo]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL
test_framework = unity
test_build_src = yes
build_src_filter = +<*> -<main.cpp> -<test_channel.cpp>