; -- Algorithmic test env ------------------------------------------------------
; Runs test/test_tuner_algo on hardware using synthetic sine-wave data.
; No guitar input needed. See test/test_tuner_algo/test_main.cpp.
; Usage:  pio test -e teensy41_algo

[env:teensy41_algo]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL
build_src_filter = +<*> -<main.cpp>
test_build_project_src = yes
test_filter = test_tuner_algo
lib_deps = olikraus/U8g2@^2.36.18

; -- MPM production env --------------------------------------------------------
; Same as teensy41 but with McLeod Pitch Method active via compile-time flag.
; detectPitch() auto-dispatches to detectPitchMPM() when USE_MPM is defined.
; Toggle algorithm: add/remove -D USE_MPM from build_flags in [env:teensy41].

[env:teensy41_mpm]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D USE_MPM
build_src_filter = +<*> -<main.cpp>
test_build_project_src = yes
lib_deps = olikraus/U8g2@^2.36.18
