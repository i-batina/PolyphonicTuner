; -- Motor Manual Test envs ---------------------------------------------------
; Deploy one string at a time to manually detune/retune via keyboard.
; Replace the number suffix with the string you're testing (1=Low E … 6=High E)

[env:teensy41_manual_1]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
build_flags = -D USB_SERIAL -D MOTOR_MANUAL_TEST=1
